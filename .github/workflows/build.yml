name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - v3.6
      - v3.6-beta3-build
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-27" \
            "build-tools;29.0.3" \
            "ndk;21.4.7075529"

      - name: Configure NDK for legacy Android Gradle Plugin
        run: echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MDWechat-v3.6-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
